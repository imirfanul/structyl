name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Force-deploy docs to Vercel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Vercel builds remotely using the structyl project's settings
      # (Root Directory = apps/docs). --force skips the build cache so we
      # never serve a stale build. Project/org resolved from env secrets,
      # so no committed .vercel link is needed.
      - name: Deploy to Vercel (production, no cache)
        run: npx --yes vercel@latest --prod --force --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Announce the docs deploy in the #dev-log channel (separate webhook from
      # releases). No-op if the secret is unset.
      - name: Announce docs update on Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DOCS_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          node -e '
            const https = require("https");
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) { console.log("No DISCORD_WEBHOOK_URL secret set — skipping."); process.exit(0); }
            const msg = (process.env.COMMIT_MSG || "").split("\n")[0];
            const content = "📚 **Docs updated & deployed** → https://www.structyl.com/docs\n" +
              "> " + msg + (process.env.COMMIT_URL ? "\n" + process.env.COMMIT_URL : "");
            const body = JSON.stringify({ username: "structyl docs", content });
            const u = new URL(webhook);
            const req = https.request(u, { method: "POST", headers: {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(body),
            }}, res => { res.resume(); res.on("end", () => process.exit(res.statusCode < 300 ? 0 : 1)); });
            req.on("error", e => { console.error(e); process.exit(1); });
            req.write(body); req.end();
          '
