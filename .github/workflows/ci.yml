name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'apps/docs/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'apps/docs/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Storybook story + accessibility tests run in storybook.yml
      # (vitest --project storybook, browser mode). Not duplicated here.

      - name: Bundle size check
        run: pnpm size

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Authenticate with npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> $HOME/.npmrc
          npm whoami

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish with npm provenance (uses the job's id-token: write +
          # the repository field now present in every package.json).
          NPM_CONFIG_PROVENANCE: 'true'

      # Announce to the #announcements channel ONLY when packages were actually
      # published to npm (not when changesets just opens a "version packages" PR).
      - name: Announce release on Discord
        if: steps.changesets.outputs.published == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node -e '
            const https = require("https");
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) { console.log("No DISCORD_WEBHOOK_URL secret set — skipping."); process.exit(0); }
            const pkgs = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
            const lines = pkgs.map(p => "• `" + p.name + "@" + p.version + "`").join("\n");
            const content = "🚀 **New release published to npm**\n" + lines +
              "\n\n📦 https://www.npmjs.com/org/structyl";
            const body = JSON.stringify({ username: "structyl releases", content });
            const u = new URL(webhook);
            const req = https.request(u, { method: "POST", headers: {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(body),
            }}, res => { res.resume(); res.on("end", () => process.exit(res.statusCode < 300 ? 0 : 1)); });
            req.on("error", e => { console.error(e); process.exit(1); });
            req.write(body); req.end();
          '
